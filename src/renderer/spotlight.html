<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Click-through halo window for "encontrar a bolha": sonar rings that
         expand well past the bubble. Round by construction — the window is
         fully transparent, so there is no container edge to leave a square
         ghost behind. --ring is injected by main with the live theme accent. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      @keyframes sonar {
        0% {
          transform: scale(0.34);
          opacity: 0.95;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }
      .ring {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px solid var(--ring, #e7edf3);
        box-shadow:
          0 0 18px 2px var(--ring, #e7edf3),
          inset 0 0 10px var(--ring, #e7edf3);
        opacity: 0;
        transform: scale(0.34);
        animation: sonar 1.15s ease-out infinite;
      }
      .ring:nth-child(2) {
        animation-delay: 0.38s;
      }
      .ring:nth-child(3) {
        animation-delay: 0.76s;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </body>
</html>
