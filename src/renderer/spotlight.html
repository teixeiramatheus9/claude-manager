<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Click-through halo window for "encontrar a bolha": sonar rings that
         expand well past the bubble. --ring is injected by main with the live
         theme accent.
         The window is transparent, but transparency alone does not make the
         halo round: the rings' glow spreads ~20px past the border and the
         window edge cuts it in a straight line, which reads as a square box
         on a dark background. Two things keep that from happening — the rings
         stop short of the edge (see .ring inset and the sonar end scale), and
         the radial mask fades whatever is left well before the border. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        -webkit-mask-image: radial-gradient(circle at center, #000 58%, transparent 80%);
        mask-image: radial-gradient(circle at center, #000 58%, transparent 80%);
      }
      @keyframes sonar {
        0% {
          transform: scale(0.28);
          opacity: 0.95;
        }
        100% {
          /* stops short of the window edge so the glow never reaches it */
          transform: scale(0.82);
          opacity: 0;
        }
      }
      .ring {
        position: absolute;
        inset: 26px;
        border-radius: 50%;
        border: 2px solid var(--ring, #e7edf3);
        box-shadow:
          0 0 18px 2px var(--ring, #e7edf3),
          inset 0 0 10px var(--ring, #e7edf3);
        opacity: 0;
        transform: scale(0.34);
        animation: sonar 1.15s ease-out infinite;
      }
      .ring:nth-child(2) {
        animation-delay: 0.38s;
      }
      .ring:nth-child(3) {
        animation-delay: 0.76s;
      }
      /* Gentle mode: the notification waves — slower emission, softer glow,
         one ring fewer. Runs for as long as a chat waits unseen. */
      @keyframes sonar-gentle {
        0% {
          transform: scale(0.3);
          opacity: 0.55;
        }
        100% {
          transform: scale(0.82);
          opacity: 0;
        }
      }
      body.gentle .ring {
        animation: sonar-gentle 2.6s ease-out infinite;
        border-width: 1.5px;
        box-shadow:
          0 0 12px 1px var(--ring, #e7edf3),
          inset 0 0 6px var(--ring, #e7edf3);
      }
      body.gentle .ring:nth-child(2) {
        animation-delay: 1.3s;
      }
      body.gentle .ring:nth-child(3) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </body>
</html>
