<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        user-select: none;
      }
      /* Wayland only: the compositor drag region is the only way to move the
         window there; interactive elements opt out below. In managed (X11)
         mode dragging is done in JS, so no app-region at all. */
      body:not(.managed) {
        -webkit-app-region: drag;
      }
      /* Managed (X11) mode: expansion can flip to the left of the bubble
         when close to the screen's right edge. */
      body.flip #row {
        flex-direction: row-reverse;
      }
      body.flip #tooltip {
        margin: 8px 0 8px 8px;
      }
      #row {
        display: flex;
        align-items: flex-start;
      }
      #bubble {
        width: 64px;
        height: 64px;
        margin: 8px;
        flex-shrink: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #e8946a, #d97757 60%, #b45309);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        position: relative;
      }
      /* Explicit: the icon itself must be a drag handle — it does not
         pick this up from the body's drag region. */
      body:not(.managed) #bubble {
        -webkit-app-region: drag;
      }
      #core {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: #fff;
        cursor: pointer;
      }
      #badge {
        -webkit-app-region: no-drag;
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        background: linear-gradient(135deg, #fb7185, #e11d48);
        color: #fff;
        font: 600 11px system-ui, sans-serif;
        letter-spacing: 0.2px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        box-sizing: border-box;
        box-shadow:
          0 2px 8px rgba(225, 29, 72, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        cursor: pointer;
      }
      #badge.pop {
        animation: badge-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes badge-pop {
        0% {
          transform: scale(0.4);
        }
        70% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      #tooltip {
        -webkit-app-region: no-drag;
        display: none;
        margin: 8px 8px 8px 0;
        max-width: 264px;
        background: #1c1917;
        color: #e7e5e4;
        border: 1px solid #d97757;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        padding: 10px 14px;
        cursor: pointer;
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      #tooltip-project {
        font-size: 12px;
        font-weight: 700;
        color: #e8946a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #tooltip-text {
        font-size: 13px;
        line-height: 1.35;
        margin-top: 4px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      #panel {
        -webkit-app-region: no-drag;
        display: none;
        margin: 0 8px 8px 8px;
        width: 356px;
        height: 430px;
        background: #1c1917;
        color: #e7e5e4;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
      }
      body:not(.managed) #panel header {
        -webkit-app-region: drag;
      }
      #panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(135deg, #d97757, #b45309);
        color: #fff;
      }
      #panel h1 {
        margin: 0;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .header-actions button {
        -webkit-app-region: no-drag;
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.9;
      }
      .header-actions button:hover {
        background: rgba(255, 255, 255, 0.15);
        opacity: 1;
      }
      #update-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        border: none;
        background: linear-gradient(135deg, #d97757, #b45309);
        color: #fff;
        font: 600 12px system-ui, sans-serif;
        padding: 8px 12px;
        cursor: pointer;
      }
      #update-banner:hover {
        filter: brightness(1.1);
      }
      #update-banner.hidden {
        display: none;
      }
      #settings-pop {
        background: #292524;
        border-bottom: 1px solid #3b3734;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
      }
      #settings-pop.hidden {
        display: none;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #d6d3d1;
      }
      .setting-row input[type='range'] {
        flex: 1;
        accent-color: #d97757;
      }
      .setting-row select {
        background: #1c1917;
        color: #e7e5e4;
        border: 1px solid #44403c;
        border-radius: 7px;
        padding: 3px 8px;
        font-size: 12px;
        outline: none;
      }
      #sound-test {
        align-self: flex-end;
        background: #d97757;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 12px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #sound-test:hover {
        background: #e8946a;
      }
      .setting-subtitle {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #78716c;
        margin-top: 2px;
      }
      .setting-row.type-row {
        padding-left: 8px;
      }
      .setting-row.type-row span {
        font-size: 11px;
        color: #a8a29e;
      }
      .setting-row input[type='checkbox'] {
        accent-color: #d97757;
        width: 15px;
        height: 15px;
      }
      #update-check {
        align-self: stretch;
        background: #292524;
        border: 1px solid #44403c;
        border-radius: 8px;
        color: #e7e5e4;
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #update-check:hover {
        border-color: #d97757;
      }
      #update-check:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      #update-check-feedback {
        font-size: 11px;
        color: #a8a29e;
      }
      #update-check-feedback:empty {
        display: none;
      }
      .setting-divider {
        height: 1px;
        background: #3b3734;
        margin: 2px 0;
      }
      #budget-label {
        color: #e8946a;
        font-weight: 600;
      }
      #usage-line {
        font-size: 11px;
        color: #a8a29e;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #usage-line .eco-badge {
        background: #facc15;
        color: #1c1917;
        font-weight: 700;
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 999px;
      }
      #sessions {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      #sessions.hidden,
      #chat.hidden {
        display: none;
      }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #chat-messages::-webkit-scrollbar {
        width: 6px;
      }
      #chat-messages::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 999px;
      }
      .chat-bubble {
        max-width: 85%;
        font-size: 13px;
        line-height: 1.4;
        padding: 8px 11px;
        border-radius: 13px;
        white-space: pre-wrap;
      }
      .chat-bubble.user {
        align-self: flex-end;
        background: #d97757;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .chat-bubble.manager {
        align-self: flex-start;
        background: #292524;
        border: 1px solid #3b3734;
        border-bottom-left-radius: 4px;
      }
      .chat-bubble.pending {
        color: #a8a29e;
        font-style: italic;
      }
      #chat-empty {
        text-align: center;
        color: #a8a29e;
        font-size: 12px;
        margin: auto 20px;
      }
      #chat-input-row {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #3b3734;
      }
      #chat-input {
        flex: 1;
        background: #292524;
        border: 1px solid #44403c;
        border-radius: 9px;
        color: #e7e5e4;
        font-size: 13px;
        padding: 7px 11px;
        outline: none;
      }
      #chat-input:focus {
        border-color: #d97757;
      }
      #chat-send {
        background: #d97757;
        border: none;
        border-radius: 9px;
        color: #fff;
        padding: 0 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      #chat-send:hover {
        background: #e8946a;
      }
      #chat-send:disabled {
        opacity: 0.5;
      }
      #sessions::-webkit-scrollbar {
        width: 6px;
      }
      #sessions::-webkit-scrollbar-track {
        background: transparent;
      }
      #sessions::-webkit-scrollbar-thumb {
        background: #44403c;
        border-radius: 999px;
      }
      #sessions::-webkit-scrollbar-thumb:hover {
        background: #57534e;
      }
      .session {
        background: #292524;
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .session:hover {
        background: #32302c;
      }
      .session.unread {
        outline: 1px solid #d97757;
      }
      .session-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.working {
        background: #22c55e;
        animation: pulse 1.4s infinite;
      }
      .dot.done {
        background: #38bdf8;
      }
      .dot.waiting {
        background: #facc15;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .name {
        font-weight: 600;
        font-size: 14px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .time {
        font-size: 11px;
        color: #a8a29e;
      }
      .title {
        font-size: 12px;
        color: #a8a29e;
        margin-top: 4px;
      }
      .message {
        font-size: 13px;
        margin-top: 8px;
        line-height: 1.4;
        background: #1c1917;
        border: 1px solid #3b3734;
        border-left: 3px solid #d97757;
        border-radius: 10px;
        padding: 8px 26px 8px 10px;
        position: relative;
      }
      .message-dismiss {
        position: absolute;
        top: 5px;
        right: 5px;
        background: none;
        border: none;
        color: #78716c;
        cursor: pointer;
        padding: 3px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .message-dismiss:hover {
        color: #e7e5e4;
        background: rgba(255, 255, 255, 0.08);
      }
      .options-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .option-chip {
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 999px;
        background: #292524;
        border: 1px solid #44403c;
        color: #e7e5e4;
        white-space: nowrap;
      }
      .option-chip.clickable {
        cursor: pointer;
        border-color: #d97757;
      }
      .option-chip.clickable:hover {
        background: #d97757;
        color: #fff;
      }
      .option-chip.clickable:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .question-text {
        font-weight: 600;
      }
      .question-text,
      .title,
      #tooltip-project {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .question-text svg,
      .title svg,
      #tooltip-project svg {
        flex-shrink: 0;
      }
      .question-hint {
        font-size: 11px;
        color: #a8a29e;
        font-style: italic;
        margin-top: 6px;
      }
      .reply {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        cursor: default;
      }
      .reply input {
        flex: 1;
        background: #1c1917;
        border: 1px solid #44403c;
        border-radius: 8px;
        color: #e7e5e4;
        font-size: 12px;
        padding: 6px 10px;
        outline: none;
      }
      .reply input:focus {
        border-color: #d97757;
      }
      .reply button {
        background: #d97757;
        border: none;
        border-radius: 8px;
        color: #fff;
        padding: 0 9px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .reply button:hover {
        background: #e8946a;
      }
      .reply button:disabled {
        opacity: 0.5;
      }
      .reply-feedback {
        font-size: 11px;
        color: #a8a29e;
        margin-top: 4px;
      }
      #mute {
        -webkit-app-region: no-drag;
      }
      #empty {
        text-align: center;
        color: #a8a29e;
        font-size: 13px;
        margin-top: 40px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div id="row">
      <div id="bubble">
        <div id="core">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l1.9 7.1 7.1 1.9-7.1 1.9-1.9 7.1-1.9-7.1-7.1-1.9 7.1-1.9z"/></svg>
        </div>
        <span id="badge"></span>
      </div>
      <div id="tooltip">
        <div id="tooltip-project"></div>
        <div id="tooltip-text"></div>
      </div>
    </div>
    <div id="panel">
      <header>
        <h1>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l1.9 7.1 7.1 1.9-7.1 1.9-1.9 7.1-1.9-7.1-7.1-1.9 7.1-1.9z"/></svg>
          Claude Manager
        </h1>
        <div class="header-actions">
          <button id="chat-toggle" title="Falar com o gerente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg>
          </button>
          <button id="settings" title="Configurações">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
          </button>
          <button id="mute" title="Som liga/desliga"></button>
          <button id="close" title="Fechar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </header>
      <button id="update-banner" class="hidden"></button>
      <div id="settings-pop" class="hidden">
        <label class="setting-row">
          <span>Volume geral</span>
          <input id="volume" type="range" min="0" max="100" />
        </label>
        <label class="setting-row">
          <span>Timbre</span>
          <select id="timbre">
            <option value="marimba">Marimba</option>
            <option value="cristal">Cristal</option>
            <option value="grave">Grave</option>
          </select>
        </label>
        <div class="setting-subtitle">Volume por tipo</div>
        <label class="setting-row type-row">
          <span>Início de task</span>
          <input id="vol-start" data-kind="start" type="range" min="0" max="100" />
        </label>
        <label class="setting-row type-row">
          <span>Término de task</span>
          <input id="vol-done" data-kind="done" type="range" min="0" max="100" />
        </label>
        <label class="setting-row type-row">
          <span>Pergunta</span>
          <input id="vol-question" data-kind="question" type="range" min="0" max="100" />
        </label>
        <label class="setting-row type-row">
          <span>Esperando você</span>
          <input id="vol-waiting" data-kind="waiting" type="range" min="0" max="100" />
        </label>
        <label class="setting-row">
          <span>Falar notificações (TTS)</span>
          <input id="tts" type="checkbox" />
        </label>
        <button id="sound-test">Testar som</button>
        <div class="setting-divider"></div>
        <label class="setting-row">
          <span>Terminal</span>
          <select id="terminal">
            <option value="auto">Auto (detectar)</option>
            <option value="warp">Warp</option>
            <option value="gnome-terminal">GNOME Terminal</option>
            <option value="kgx">GNOME Console</option>
            <option value="kitty">Kitty</option>
            <option value="alacritty">Alacritty</option>
            <option value="konsole">Konsole</option>
            <option value="tilix">Tilix</option>
            <option value="wezterm">WezTerm</option>
          </select>
        </label>
        <div class="setting-divider"></div>
        <button id="update-check">Buscar versão mais recente</button>
        <div id="update-check-feedback"></div>
        <div class="setting-divider"></div>
        <label class="setting-row">
          <span>Voz</span>
          <select id="voice"></select>
        </label>
        <div class="setting-divider"></div>
        <label class="setting-row">
          <span>Tokens/dia <strong id="budget-label"></strong></span>
          <input id="budget" type="range" min="0" max="500000" step="10000" />
        </label>
        <div id="usage-line"></div>
      </div>
      <div id="sessions"></div>
      <div id="chat" class="hidden">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input id="chat-input" placeholder="Fala com o gerente…" />
          <button id="chat-send" title="Enviar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
