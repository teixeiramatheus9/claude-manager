name: release

# Merge/push to main from a release/*, feat/* or fix/* branch (or with a
# conventional-commit subject) bumps MAJOR.MINOR.PATCH accordingly, tags,
# builds Linux + macOS packages and publishes the GitHub release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - id: decide
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE="$(printf '%s' "$MESSAGE" | head -n1)"
          BUMP=""
          # merge commits carry the source branch name
          if   echo "$FIRST_LINE" | grep -qE 'from [^ ]+/release/'; then BUMP=major
          elif echo "$FIRST_LINE" | grep -qE 'from [^ ]+/feat/';    then BUMP=minor
          elif echo "$FIRST_LINE" | grep -qE 'from [^ ]+/fix/';     then BUMP=patch
          # direct pushes fall back to the conventional-commit prefix
          elif echo "$FIRST_LINE" | grep -qE '^release(\(|!|:)';    then BUMP=major
          elif echo "$FIRST_LINE" | grep -qE '^feat(\(|!|:)';       then BUMP=minor
          elif echo "$FIRST_LINE" | grep -qE '^fix(\(|!|:)';        then BUMP=patch
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "decided bump: ${BUMP:-none (no release)}"

  # Versions live in git TAGS (the source of truth), so the CI never has to
  # push to the protected main branch — it only pushes the new tag.
  version:
    needs: plan
    if: ${{ needs.plan.outputs.bump != '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          case "${{ needs.plan.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
            minor) MINOR=$((MINOR+1)); PATCH=0;;
            patch) PATCH=$((PATCH+1));;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          git tag -a "v$VERSION" -m "release v$VERSION"
          git push origin "v$VERSION"
          # seed the draft release now, so the parallel build jobs all attach
          # to the same one instead of racing to create it
          gh release create "v$VERSION" --draft --title "Vizor v$VERSION" --notes "em preparação…"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "released version: v$VERSION (from $LATEST)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job per package so each target is individually trackable and a hang
  # in one never blocks the others.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppImage
            os: ubuntu-latest
            args: --linux AppImage
          - name: deb
            os: ubuntu-latest
            args: --linux deb
          - name: rpm
            os: ubuntu-latest
            args: --linux rpm
            needs-rpm-tools: true
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the mac build is intentionally unsigned
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the runner's azure apt mirror flakes and wedges apt — point straight
      # at archive.ubuntu.com, cap the step and retry
      - if: matrix.needs-rpm-tools == true
        timeout-minutes: 6
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends rpm; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s…"
            sleep 15
          done
          exit 1
      - run: npm ci
      # stamp the tag's version into the build workspace (main stays untouched)
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.args }} --publish always

  publish:
    # only goes live when ALL five packages built — if one fails, the release
    # stays draft; re-run the failed job and publish follows automatically
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The release body is the changelogs/ files ADDED since the previous
      # tag, in filename order and grouped by the type in the name; falls back
      # to auto-generated notes. One file per change means no PR ever has to
      # touch a shared file (see changelogs.md).
      - run: |
          VERSION="v${{ needs.version.outputs.version }}"
          PREVIOUS=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$VERSION" | head -n1)
          FEATS=""
          FIXES=""
          if [ -n "$PREVIOUS" ]; then
            ADDED=$(git diff --name-only --diff-filter=A "$PREVIOUS".."$VERSION" -- changelogs/ | sort)
            while IFS= read -r file; do
              if [ -z "$file" ]; then
                continue
              fi
              BODY=$(git show "$VERSION:$file")
              case "$(basename "$file")" in
                *-feat-*) FEATS="${FEATS}${BODY}"$'\n' ;;
                *)        FIXES="${FIXES}${BODY}"$'\n' ;;
              esac
            done <<< "$ADDED"
          fi
          NOTES=""
          if [ -n "$FEATS" ]; then
            NOTES="### Feats"$'\n'"$FEATS"
          fi
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}"$'\n'"### Fixes"$'\n'"$FIXES"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$VERSION" --jq .body)
          fi
          gh release edit "$VERSION" --notes "$NOTES" --draft=false --latest
