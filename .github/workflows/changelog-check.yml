name: changelog

# feat/*, fix/* and release/* PRs MUST add a file to changelogs/ — one file per
# change, never a shared one, so two PRs can never conflict over a release note.
# See changelogs.md for the format.
on:
  pull_request:
    branches: [main, 'release/**', 'feat/[0-9]*']

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in
            feat/*|fix/*|release/*) ;;
            *) echo "branch '$HEAD_REF' não exige release note ✓"; exit 0 ;;
          esac
          ADDED=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- changelogs/)
          if [ -z "$ADDED" ]; then
            echo "::error::PRs de feat/fix/release DEVEM adicionar um arquivo em changelogs/ (veja changelogs.md) — ele vira a nota da release."
            exit 1
          fi
          STATUS=0
          while IFS= read -r file; do
            case "$(basename "$file")" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-feat-*.md) ;;
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]-fix-*.md) ;;
              *)
                echo "::error file=$file::nome fora do padrão AAAAMMDD-HHMM-<feat|fix>-<slug>.md (veja changelogs.md)"
                STATUS=1
                ;;
            esac
            if [ ! -s "$file" ]; then
              echo "::error file=$file::arquivo de changelog vazio"
              STATUS=1
            fi
          done <<< "$ADDED"
          [ "$STATUS" -eq 0 ] && echo "release note adicionada ✓"
          exit "$STATUS"
